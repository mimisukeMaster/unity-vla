# Base config. Other YAML files are deep-merged over this one.
# Units: meters, radians, seconds. Positions are in Unity world coordinates
# (x = robot's right, y = up, z = robot's forward); the robot base sits at the origin.

unity:
  host: 127.0.0.1
  port: 5555
  timeout_s: 30

sim:
  control_hz: 15        # DROID recording rate; 1 step = 1/15 s of sim time
  physics_dt: 0.002     # PhysX substep; 33 substeps per control step

policy:
  type: dummy           # dummy | openpi
  mode: hold            # dummy only: hold | sine | replay
  open_loop_horizon: 10 # actions executed per inference (pi0: 10, pi0.5: 15)

gripper:
  binarize: true        # command > threshold -> closed
  threshold: 0.5

task:
  prompt: put the red cube in the bowl
  max_steps: 450        # 30 s
  # DROID reset pose (rad); see docs/droid_contract.md
  home_qpos: [0.0, -0.6283185, 0.0, -2.5132741, 0.0, 1.8849556, 0.0]
  scene:
    table: {size: [1.2, 0.04, 0.8], center: [0.0, -0.02, 0.45], color: [0.55, 0.42, 0.3]}
    region: {x: [-0.22, 0.22], z: [0.38, 0.62]}   # where objects may spawn
    min_spacing: 0.11
    objects:
      - {name: red_cube,   shape: cube, size: 0.05, color: [0.85, 0.1, 0.1], mass: 0.08}
      - {name: green_cube, shape: cube, size: 0.05, color: [0.1, 0.7, 0.2], mass: 0.08}
      - {name: blue_cube,  shape: cube, size: 0.05, color: [0.1, 0.25, 0.85], mass: 0.08}
      - {name: bowl,       shape: bowl, size: 0.16, color: [0.9, 0.9, 0.88], mass: 0.3}
    goal: {type: place, target: red_cube, container: bowl}   # place | lift
    hold_s: 0.5         # success must hold this long (sim time)
    randomize_colors: false
    cameras:
      exterior: {position: [-0.55, 0.42, 0.25], look_at: [0.0, 0.05, 0.5], vfov: 62, width: 320, height: 180}
      wrist:    {vfov: 58, width: 320, height: 180}   # mounted on the gripper (see Robot prefab)
    lighting: {intensity: 1.1, shadows: true}

episodes:
  seeds: [0]

record:
  out_dir: runs   # relative to the repo root
  video: true
